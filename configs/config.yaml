model:
  name: resunet++                 # Choose: 'unet' (29M params) or 'resunet++' (50M params, 2x better quality)
  input_size: 256
  channels: 3

# ─────────────────────────────────────────────────────────────────────────────
# TRAINING
# ─────────────────────────────────────────────────────────────────────────────
training:
  batch_size: 8
  epochs: 150
  learning_rate: 0.0001           # decoder / bottleneck LR
  encoder_lr_factor: 0.1          # encoder trains at LR × this value (fine-tune slowly)
  mixed_precision: true           # AMP — ~2× faster on GPU, uses less VRAM
  gradient_clip: 1.0              # max gradient norm
  cudnn_benchmark: true           # faster for fixed input size
  scheduler_patience: 10          # ReduceLROnPlateau: epochs before LR drop (was 5 — too aggressive)
  scheduler_factor: 0.5           # LR multiplied by this when plateau detected
  scheduler_min_lr: 1.0e-6        # never drop LR below this — prevents model from freezing

# ─────────────────────────────────────────────────────────────────────────────
# LOSS
# Only l1_weight and perceptual_weight are active.
# The rest are accepted by ShadowRemovalLoss but silently ignored.
# ─────────────────────────────────────────────────────────────────────────────
loss:
  l1_weight: 1.0                  # L1 on face region (mask-weighted) — pixel accuracy
  perceptual_weight: 0.1          # VGG16 relu2_2 + relu3_3 on full image — texture sharpness
  ssim_weight: 0.0                # disabled
  identity_weight: 0.0            # disabled
  color_weight: 0.0               # disabled

# ─────────────────────────────────────────────────────────────────────────────
# DATA
# ─────────────────────────────────────────────────────────────────────────────
data:
  split_dir: split/splited_dataset_data
  output_size: 256
  num_workers: 0      # 0 = main thread only — avoids Windows paging file exhaustion from spawning CUDA worker processes
  pin_memory: false       # pin_memory requires worker threads; must be false when num_workers=0
  persistent_workers: false  # no workers to persist

# ─────────────────────────────────────────────────────────────────────────────
# CHECKPOINTS
# ─────────────────────────────────────────────────────────────────────────────
checkpoint:
  dir: checkpoints
  save_every: 5                   # also save every N epochs (always saves latest + best)
