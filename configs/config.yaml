model:
  name: unet_resnet34
  input_size: 512
  channels: 3

training:
  batch_size: 4
  epochs: 200
  lr: 0.00001
  enc_lr: 0.000001
  no_amp: true
  optimizer: AdamW
  weight_decay: 0.0001
  save_every: 10
  device: auto          # auto | cuda | cpu | mps

early_stopping:
  enabled: true
  patience: 15          # stop if val loss doesn't improve for N epochs
  min_delta: 0.0001     # min change to qualify as improvement

logging:
  log_dir: logs         # relative to project root
  save_frequency: 1     # save logs every N batches

dataloader:
  num_workers: 0        # set 0 on Windows if you have issues
  pin_memory: true
  persistent_workers: true

loss:
  l1_weight: 1.0
  ssim_weight: 0.5

data:
  dataset_dir: dataset
  input_subdir: input
  target_subdir: target
  splits_dir: dataset/splits
  image_size: 512
  train_ratio: 0.85
  seed: 42

checkpoint:
  dir: checkpoints
  save_every: 10

inference:
  output_dir: Results/output
  input_dir: Results/input
